server:
  port: 8888
spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://localhost:9999
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: 'http://localhost:4200'
                allowedMethods: '*'
                allowedHeaders: '*'
          routes:
            - id: r1
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customers/**
            - id: r2
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/products/**
eureka:
  instance:
    prefer-ip-address: true
